# Full league player catalog sync + re-tier (transfers / rarity).
# Keep off the page-load path — this can take several minutes.
#
# Required repo secrets (same as gameweek cron):
#   PROD_BASE_URL  — e.g. https://presi.onrender.com
#   CRON_SECRET    — must match process.env.CRON_SECRET on the server

name: Players catalog cron

on:
  schedule:
    # Mondays 11:00 UTC ≈ 06:00 Colombia
    - cron: "0 11 * * 1"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/cron/players
        env:
          PROD_BASE_URL: ${{ secrets.PROD_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$PROD_BASE_URL" ]; then
            echo "Missing secret PROD_BASE_URL"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing secret CRON_SECRET"
            exit 1
          fi
          CODE=$(curl -sS -o /tmp/players-cron.json -w "%{http_code}" \
            --max-time 600 \
            -X POST "${PROD_BASE_URL%/}/api/cron/players" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json")
          echo "HTTP $CODE"
          cat /tmp/players-cron.json
          echo
          test "$CODE" = "200"
